$schema: http://json-schema.org/draft-07/schema#
title: Scope comparison input
type: object
additionalProperties: false
required: [schemaVersion, sources]
properties:
  schemaVersion: {const: 1}
  sources:
    type: array
    minItems: 1
    maxItems: 20
    items: {$ref: '#/definitions/source'}
  candidates:
    type: array
    maxItems: 2000
    items: {$ref: '#/definitions/candidate'}
  mappings:
    type: array
    maxItems: 5000
    items:
      type: object
      additionalProperties: false
      required: [sourceId, recordId, scopeRefs, reason]
      properties:
        sourceId: {$ref: '#/definitions/id'}
        recordId: {$ref: '#/definitions/text'}
        scopeRefs: {$ref: '#/definitions/refs'}
        reason: {$ref: '#/definitions/text'}
definitions:
  id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,79}$'}
  text: {type: string, minLength: 1, maxLength: 2000}
  digest: {type: string, pattern: '^[a-f0-9]{64}$'}
  refs:
    type: array
    uniqueItems: true
    maxItems: 20
    items: {$ref: '#/definitions/text'}
  source:
    type: object
    additionalProperties: false
    required: [id, format, path]
    properties:
      id: {$ref: '#/definitions/id'}
      format: {enum: [mindmap, csv, xlsx]}
      path: {$ref: '#/definitions/text'}
      sheet: {$ref: '#/definitions/text'}
      columns:
        type: object
        additionalProperties: false
        required: [group, label]
        properties:
          group: {$ref: '#/definitions/text'}
          label: {$ref: '#/definitions/text'}
          id: {$ref: '#/definitions/text'}
      startMarker: {$ref: '#/definitions/text'}
      endMarker: {$ref: '#/definitions/text'}
      defaultPlatforms:
        type: array
        uniqueItems: true
        maxItems: 20
        items: {$ref: '#/definitions/text'}
      provenance:
        type: object
        additionalProperties: false
        properties:
          title: {$ref: '#/definitions/text'}
          table: {$ref: '#/definitions/text'}
          view: {$ref: '#/definitions/text'}
          observedAt: {type: string, format: date-time}
          coverage: {$ref: '#/definitions/text'}
    allOf:
      - if: {properties: {format: {enum: [csv, xlsx]}}}
        then: {required: [columns]}
      - if: {properties: {format: {const: xlsx}}}
        then: {required: [sheet]}
      - if: {required: [startMarker]}
        then: {required: [endMarker]}
      - if: {required: [endMarker]}
        then: {required: [startMarker]}
  location:
    type: object
    additionalProperties: false
    required: [path, symbol, startLine, endLine]
    properties:
      path: {$ref: '#/definitions/text'}
      symbol: {$ref: '#/definitions/text'}
      startLine: {type: integer, minimum: 1}
      endLine: {type: integer, minimum: 1}
  candidate:
    type: object
    additionalProperties: false
    required: [scopeRef, label, reason]
    properties:
      scopeRef: {$ref: '#/definitions/text'}
      label: {$ref: '#/definitions/text'}
      reason: {$ref: '#/definitions/text'}
      locations:
        type: array
        maxItems: 10
        items: {$ref: '#/definitions/location'}
  review:
    type: object
    additionalProperties: false
    required: [schemaVersion, inputDigest, inventoryDigest, sources, items]
    properties:
      schemaVersion: {const: 1}
      inputDigest: {$ref: '#/definitions/digest'}
      inventoryDigest: {$ref: '#/definitions/digest'}
      sources:
        type: array
        minItems: 1
        maxItems: 20
        items:
          type: object
          additionalProperties: false
          required: [id, status, recordIds]
          properties:
            id: {$ref: '#/definitions/id'}
            status: {enum: [available, unavailable]}
            digest: {$ref: '#/definitions/digest'}
            reason: {$ref: '#/definitions/text'}
            recordIds:
              type: array
              uniqueItems: true
              maxItems: 5000
              items: {$ref: '#/definitions/text'}
          allOf:
            - if: {properties: {status: {const: available}}}
              then: {required: [digest]}
      items:
        type: array
        maxItems: 5000
        items:
          type: object
          additionalProperties: false
          required: [sourceId, recordId, disposition, scopeRefs, reason]
          properties:
            sourceId: {$ref: '#/definitions/id'}
            recordId: {$ref: '#/definitions/text'}
            disposition: {enum: [pending, formal, platform, infrastructure, excluded]}
            scopeRefs: {$ref: '#/definitions/refs'}
            reason: {$ref: '#/definitions/text'}
